<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Paradise - Welcome Back</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles2.css">
</head>
<body>
    <div class="bg-overlay"></div>

    <main class="page-container">
        <section class="login-card">
            
            <div class="card-header">
                <div class="brand-logo">
                    <i class="fa-solid fa-leaf"></i>
                </div>
                <h1>Welcome Back</h1>
                <p class="subtitle">Welcome back to Plant Paradise</p>
            </div>

            <form action="#" method="POST" class="login-form">
                
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope field-icon-left"></i>
                        <input type="email" id="email" name="email" placeholder="john@example.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock field-icon-left"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <i class="fa-regular fa-eye field-icon-right"></i>
                    </div>
                </div>

                <div class="options-row">
                    <label class="remember-me">
                        <input type="checkbox" name="remember" id="remember">
                        <span class="custom-checkbox"></span>
                        <span class="label-text">Remember Me</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Login</span>
                    <i class="fa-solid fa-leaf"></i>
                </button>

                <p class="register-prompt">
                    Don't have an account? <a href="#">Create Account</a>
                </p>

            </form>
        </section>
    </main>
</body>
</html>
