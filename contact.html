<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Plant Paradise</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="cstyle.css">
</head>
<body>
  <div class="hero-grid-bg">
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
    <div class="box box5"></div>
    <div class="box box6"></div>
    <div class="box box7"></div>
    <div class="box box8"></div>
    <div class="box box9"></div>
    <div class="box box10"></div>
    <div class="box box11"></div>
    <div class="box box12"></div>
  </div>
  <div class="bg-overlay"></div>
  <div class="ambient-leaf ambient-leaf-1"></div>
  <div class="ambient-leaf ambient-leaf-2"></div>

  <main class="contact-container">
    
    <section class="contact-info-section">
      <div class="brand">
        <span class="brand-icon">🌿</span>
        <div class="brand-text">
          <span class="brand-title">PLANT PARADISE</span>
          <span class="brand-tagline">GREENER TODAY • BRIGHTER TOMORROW</span>
        </div>
      </div>
      <div class="heading-wrapper">
        <h1 class="main-heading">Contact Us</h1>
        <span class="leaf-decor">🍃</span>
      </div>

      <div class="intro-text">
        <h2>We'd love to hear from you</h2>
        <p>Whether you have a question, suggestion, or just want to talk plants — we're always here for you.</p>
      </div>
      <div class="contact-meta-grid">
        <div class="meta-item">
          <div class="icon-circle">
            <i class="fa-solid fa-location-dot"></i>
          </div>
          <div class="meta-text">
            <span class="meta-label">Our Location</span>
            <span class="meta-val">Haryana, India</span>
          </div>
        </div>

        <div class="meta-item">
          <div class="icon-circle">
            <i class="fa-solid fa-envelope"></i>
          </div>
          <div class="meta-text">
            <span class="meta-label">Email Us</span>
            <span class="meta-val">nitin.kumar.25cse@bmu.edu.in</span>
          </div>
        </div>

        <div class="meta-item">
          <div class="icon-circle">
            <i class="fa-solid fa-phone"></i>
          </div>
          <div class="meta-text">
            <span class="meta-label">Call Us</span>
            <span class="meta-val">+91 82093 20618</span>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
