<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Plant Paradise</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="404styles.css">
</head>
<body>
    <main class="error-container">
        <div class="error-content">
            <div class="error-icon">
                <i class="fa-solid fa-leaf"></i>
            </div>
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Oops! This plant couldn't be found.</h2>
            <p class="error-message">The page you're looking for seems to have wandered off into the garden. Don't worry, it's still growing somewhere.</p>
            <div class="error-actions">
                <a href="index.html" class="home-btn">
                    <i class="fa-solid fa-house"></i> Go Home
                </a>
                <a href="contact.html" class="contact-btn">
                    <i class="fa-solid fa-envelope"></i> Contact Us
                </a>
            </div>
        </div>
        <div class="error-illustration">
            <div class="leaf leaf-1"></div>
            <div class="leaf leaf-2"></div>
            <div class="leaf leaf-3"></div>
            <div class="leaf leaf-4"></div>
        </div>
        <footer class="error-footer">
            <p>&copy; 2026 Plant Paradise. All rights reserved.</p>
        </footer>
    </main>
</body>
</html>
